name: Build Programming lambda firmware

on:
  push:
    paths:
      - "firmware/programming-lambda-rp2040/**"
      - ".github/workflows/build-programming-lambda-firmware.yml"
  pull_request:
    paths:
      - "firmware/programming-lambda-rp2040/**"
      - ".github/workflows/build-programming-lambda-firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out keyboard repository
        uses: actions/checkout@v4

      - name: Check out Raspberry Pi Pico SDK 2.2.0
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.2.0
          path: pico-sdk
          submodules: recursive

      - name: Install Arm embedded compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Configure firmware
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: cmake -S firmware/programming-lambda-rp2040 -B build/programming-lambda-rp2040

      - name: Build UF2
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: cmake --build build/programming-lambda-rp2040 --parallel

      - name: Upload flashable UF2
        uses: actions/upload-artifact@v4
        with:
          name: programming-lambda-uf2
          path: build/programming-lambda-rp2040/programming_lambda_keypad.uf2
          if-no-files-found: error
