<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cursor and page movement</title>
<link rel="stylesheet" href="keypads.css">
</head>
<body>
<h1>cursor and page movement</h1>
<table class="keypad" aria-label="cursor and page movement">
<tr><td class="key">MVMT</td><td class="key">TYPE</td><td class="key wide">PREVIOUS LINE</td><td class="key wide">NEXT LINE</td></tr>
<tr><td class="key wide">←<small>LONG LEFT</small></td><td class="key wide">→<small>LONG RIGHT</small></td><td class="key wide">START LINE</td><td class="key wide">END LINE</td></tr>
<tr><td class="key wide">NEXT WORD</td><td class="key xwide">NEXT SPACE-SEPARATED WORD</td><td class="key wide">MATCH DELIMITER</td><td class="key">⅓ PAGE ↑</td><td class="key">⅓ PAGE ↓</td></tr>
<tr><td class="key">7×</td><td class="key">13×</td><td class="key">17×</td><td class="key">29×</td><td class="key">⟳<small>REPEAT</small></td><td class="key">⟲<small>REPEAT</small></td></tr>
<tr><td class="key xwide">DELETE CHARACTER ←</td><td class="key wide">DELETE WORD</td><td class="key">UNDO</td></tr>
</table>
</body>
</html>
