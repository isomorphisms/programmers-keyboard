name: Qualified RP2040 ICK source compiler
description: Build the exact bare-metal frontend and verify Cortex-M0+ glyph objects.
outputs:
  compiler:
    description: Installed arm-none-eabi ICK C compiler.
    value: ${{ steps.compiler.outputs.compiler }}
runs:
  using: composite
  steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: dilapidated-shed/ick
        ref: c61e448251744a2f40ad743ebef1a027bdcd2f9d
        path: .ick-rp2040-source
        submodules: true
        persist-credentials: false
    - id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/ick-rp2040-stage
        key: ick-rp2040-v1-${{ runner.os }}-${{ runner.arch }}-c61e448251744a2f40ad743ebef1a027bdcd2f9d
    - name: Install bootstrap and declared embedded toolchain
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y build-essential flex bison texinfo libgmp-dev libmpfr-dev libmpc-dev gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
    - name: Build the exact bare-metal target
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: make -f "$GITHUB_ACTION_PATH/Makefile" ICK_SOURCE="$GITHUB_WORKSPACE/.ick-rp2040-source" ICK_BUILD="$RUNNER_TEMP/ick-rp2040-build" ICK_STAGE="$RUNNER_TEMP/ick-rp2040-stage"
    - name: Requalify every installed stage
      shell: bash
      run: make -f "$GITHUB_ACTION_PATH/Makefile" qualify ICK_SOURCE="$GITHUB_WORKSPACE/.ick-rp2040-source" ICK_STAGE="$RUNNER_TEMP/ick-rp2040-stage"
    - id: compiler
      shell: bash
      run: make -f "$GITHUB_ACTION_PATH/Makefile" outputs ICK_STAGE="$RUNNER_TEMP/ick-rp2040-stage" >> "$GITHUB_OUTPUT"
